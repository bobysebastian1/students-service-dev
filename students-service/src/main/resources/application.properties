spring.application.name=students-service

server.port = 8091

# db connection MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/NEWDB
spring.datasource.username=root
spring.datasource.password=@Boby#724640

# FORCE HIBERNATE TO CREATE/UPDATE TABLES AUTOMATICALLY
spring.jpa.hibernate.ddl-auto=update

# Optional: Show SQL queries in log to verify table creation
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicitly tell Spring to use simple in-memory caching
spring.cache.type=simple

# Optional: Set log level to see cache hits and misses in your terminal
logging.level.org.springframework.cache=TRACE

